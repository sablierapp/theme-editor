<section id="main">
    <div id="layout"></div>
</section>

<!-- Panel contents, moved into the layout by js/editor.js -->
<div hidden>
    <div class="panel" id="panel-template">
        <div class="toolbar">
            <span class="toolbar-label">Load a built-in theme</span>
            <span id="theme-buttons"></span>
            <a class="toolbar-help" href="https://pkg.go.dev/text/template#hdr-Actions" target="_blank" title="Go template syntax" aria-label="Go template syntax"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></a>
        </div>
        <div class="panel-body" id="input-editor"></div>
    </div>
    <div class="panel" id="panel-data">
        <div class="toolbar">
            <span class="toolbar-label">Sample data</span>
            <button id="format-data" title="Re-indent the JSON">Format</button>
            <button id="reset-data" title="Replace the data with the default sample data">Reset</button>
            <a class="toolbar-help" href="theme.schema.json" target="_blank" title="JSON Schema of the data" aria-label="JSON Schema of the data"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></a>
        </div>
        <div class="panel-body" id="data-editor"></div>
    </div>
    <div class="panel" id="panel-preview">
        <div class="toolbar">
            <span class="toolbar-label">Live preview</span>
            <button id="fullscreen-preview" title="Show the preview in fullscreen">Fullscreen</button>
        </div>
        <div class="panel-body preview">
            <iframe id="output"></iframe>
        </div>
    </div>
</div>
